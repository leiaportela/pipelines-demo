[project]
name = "vertex-demo"
version = "0.1.0"
description = "Vertex AI Pipelines demo: churn, CLV and demand forecast on thelook_ecommerce"
requires-python = ">=3.10,<3.13"
dependencies = [
    "kfp==2.18.2",
    "google-cloud-pipeline-components==2.23.0",
    "google-cloud-aiplatform==1.165.1",
    "google-cloud-bigquery==3.47.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "setuptools",
]
trainer = ["xgboost>=2.1,<3", "pandas", "numpy", "pyarrow", "db-dtypes"]
app = ["fastapi", "uvicorn[standard]", "httpx"]

[tool.uv]
default-groups = ["dev", "app", "trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "trainer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
